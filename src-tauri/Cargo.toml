[package]
name = "pipo"
version = "0.4.3"
description = "Pipo, bichinho virtual de desktop"
authors = ["vitormouramaker"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pipo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2.8.4"
futures-util = "0.3.34"
chrono = "0.4.45"
reqwest = { version = "0.13.5", features = ["charset", "http2", "json", "native-tls", "stream"], default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
sysinfo = "0.40.1"
arboard = "3.7.0"
tauri-plugin-notification = "2.8.0"
tokio = { version = "1.54.1", features = ["sync", "time"] }
whisper-rs = "0.16.0"
cpal = "0.18.2"
tauri-plugin-updater = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
rrule = "0.14"
chrono-tz = "0.10"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization", "Win32_System_WinRT"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
